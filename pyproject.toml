[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supereval"
version = "0.1.0"
description = "LLM and Agent evaluation dataset registry and tooling"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "satchpx" }]
keywords = ["llm", "eval", "agent", "bedrock", "promptfoo", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"

dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "boto3>=1.34",
    "duckdb>=0.10",
]

[project.urls]
Homepage = "https://satchpx.github.io/supereval/"
Repository = "https://github.com/satchpx/supereval"
Documentation = "https://satchpx.github.io/supereval/"

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]
docs = ["mkdocs-material>=9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
supereval = "supereval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["supereval"]
